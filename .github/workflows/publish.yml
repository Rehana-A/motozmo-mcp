# Publishes motozmo-mcp to npm using trusted publishing (OIDC) —
# no npm tokens are stored anywhere, and future versions go out
# automatically. Triggered by creating a GitHub Release.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5.1; pin the latest npm
      # explicitly so we never depend on the version bundled with Node.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
