# Publishes motozmo-mcp to npm using trusted publishing (OIDC) —
# no npm tokens are stored anywhere, and future versions go out
# automatically. Triggered by creating a GitHub Release.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
